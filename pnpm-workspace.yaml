saveExact: true
storeDir: .pnpm-store

packages:
  - packages/*
  - packages/*/examples/*

versioning:
  changelog:
    storage: repository

catalog:
  "@types/node": 26.5.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  "@vitest/coverage-v8": 5.0.0
  "@zemd/testing": 1.1.0
  "@zemd/tsconfig": 2.1.1
  fast-check: 4.9.0
  react: 19.2.8
  react-dom: 19.2.8
  tsdown: 0.23.0
  typescript: 7.0.2
  vitest: 5.0.0

# Seven days; keep aligned with Dependabot's npm cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@zemd/*"
  - nanoid@3.3.17 || 3.3.18
trustPolicy: no-downgrade

allowBuilds:
  sharp: true

overrides:
  nanoid@<3.3.17: ^3.3.17
  nanoid@<3.3.18: ^3.3.18
