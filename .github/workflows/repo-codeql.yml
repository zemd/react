name: CodeQL

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Catches advisories published after the last commit.
    - cron: "24 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    uses: zemd/js/.github/workflows/shared-codeql.yml@7a3e058a84bf059a8f9afa810ca4faec8fb71282 # v3
    permissions:
      contents: read # checkout the repository for analysis
      actions: read # let CodeQL read workflow-run metadata
      security-events: write # upload results to code scanning
    # with:
    #   languages: '["actions", "javascript-typescript"]'
