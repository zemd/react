# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directories: # Every workspace project plus the root manifest
      - "/"
      - "/packages/**"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      # Keep exemptions aligned with pnpm-workspace.yaml.
      exclude:
        - "@zemd/*"
    versioning-strategy: "increase" # the workspace pins exact versions (saveExact)
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
  # Update the images pinned in .devcontainer/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      devcontainer-images:
        patterns:
          - "*"
  # Update Features in any devcontainer.json files.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      devcontainer-features:
        patterns:
          - "*"
  # Also keeps the `zemd/js/.github/workflows/shared-*.yml@<sha>` pins current.
  # When it updates repo-release.yml, keep shared-tooling-ref on the same SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "zemd/js"
        - "zemd/js/*"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
